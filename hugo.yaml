baseURL: "https://nhsoul.fr"
defaultContentLanguage: "fr"
defaultContentLanguageInSubdir: false
theme: "manchette"

permalinks:
  blog: "/blog/:slug/"

languages:
  fr:
    label: "Français"
    locale: "fr-FR"
    weight: 1
    title: "Néo Huyghe, développeur à Lens"
    params:
      description: "Néo Huyghe, développeur backend à Lens : des sites et des logiciels en production pour de vrais clients."
      footer:
        closing: "Un logiciel à faire tourner ? Écrivez-moi."
    menus:
      main:
        - { name: "Projets", url: "/#projets", weight: 1, params: { pin: true } }
        - { name: "Parcours", url: "/#parcours", weight: 2 }
        - { name: "Blog", pageRef: "/blog", weight: 3 }
        - { name: "Ma stack", pageRef: "/tools", weight: 4, params: { side: "end" } }
        - { name: "CV", pageRef: "/cv", weight: 5, params: { side: "end" } }
        - { name: "Contact", url: "#contact", weight: 6, params: { side: "end", pin: true } }
      footer:
        - { name: "GitHub", url: "https://github.com/NhProGamer", weight: 1 }
        - { name: "Forgejo", url: "https://git.nhsoul.fr/nhpro", weight: 2 }
        - { name: "LinkedIn", url: "https://www.linkedin.com/in/neo-huyghe", weight: 3 }
        - { name: "Blog", pageRef: "/blog", weight: 4 }
        - { name: "CV", pageRef: "/cv", weight: 5 }
        - { name: "Ma stack", pageRef: "/tools", weight: 6 }
  en:
    label: "English"
    locale: "en-US"
    weight: 2
    title: "Néo Huyghe, developer in Lens"
    params:
      description: "Néo Huyghe, backend developer in Lens, France: websites and software running in production for real clients."
      footer:
        closing: "Got software to run? Write to me."
    menus:
      main:
        - { name: "Projects", url: "/en/#projects", weight: 1, params: { pin: true } }
        - { name: "Path", url: "/en/#path", weight: 2 }
        - { name: "Blog", pageRef: "/blog", weight: 3 }
        - { name: "My stack", pageRef: "/tools", weight: 4, params: { side: "end" } }
        - { name: "CV", pageRef: "/cv", weight: 5, params: { side: "end" } }
        - { name: "Contact", url: "#contact", weight: 6, params: { side: "end", pin: true } }
      footer:
        - { name: "GitHub", url: "https://github.com/NhProGamer", weight: 1 }
        - { name: "Forgejo", url: "https://git.nhsoul.fr/nhpro", weight: 2 }
        - { name: "LinkedIn", url: "https://www.linkedin.com/in/neo-huyghe", weight: 3 }
        - { name: "Blog", pageRef: "/blog", weight: 4 }
        - { name: "CV", pageRef: "/cv", weight: 5 }
        - { name: "My stack", pageRef: "/tools", weight: 6 }

params:
  author:
    first_name: "Néo"
    last_name: "Huyghe"
    email: "contact@nhsoul.fr"
    location: "Lens"
    # Ages on the home page and the timeline are computed from these two.
    birthdate: "2006-02-05"
    coding_since: 2017
    # Path under assets/, resized by Hugo.
    photo: "images/pfp-min.jpg"
  manchette:
    # Hue of the whole palette, in OKLCH degrees: 292 is Orion violet.
    hue: 292

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    style: "github-dark"
    lineNos: true

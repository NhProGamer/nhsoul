<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}">
<head>
  {{- partial "head.html" . }}
  {{- block "head" . }}{{ end }}
</head>
<body class="{{ block "bodyClass" . }}{{ end }}">
  {{- block "body" . }}
  <a class="skip" href="#main">{{ T "skipToContent" }}</a>
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- end }}
</body>
</html>

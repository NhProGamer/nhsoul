{{ define "main" }}
<article class="page">
  <div class="container">
    <header class="page__head">
      <h1 class="page__title">{{ .Title }}</h1>
      {{- with .Description }}
      <p class="lead">{{ . }}</p>
      {{- end }}
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}

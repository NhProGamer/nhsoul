<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- orion — etoile cardinale. Teintes = accent-hi -> accent-lo du design system Nebula,
       resolues depuis l'OKLCH source. Bascule avec le theme du systeme. -->
  <style>
    .hi { stop-color: #6E21D2 }
    .lo { stop-color: #9265EF }
    @media (prefers-color-scheme: dark) {
      .hi { stop-color: #C6A7FF }
      .lo { stop-color: #8851EB }
    }
  </style>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" class="hi"/>
    <stop offset="1" class="lo"/>
  </linearGradient>
  <path d="M16 .8C17.3 8.9 23.1 14.7 31.2 16 23.1 17.3 17.3 23.1 16 31.2 14.7 23.1 8.9 17.3 .8 16 8.9 14.7 14.7 8.9 16 .8Z" fill="url(#g)"/>
</svg>
